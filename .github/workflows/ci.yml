name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned to the CLI version database.types.ts was generated with; bumping it means
# regenerating app/src/lib/database.types.ts in the same PR.
env:
  SUPABASE_CLI_VERSION: 2.117.0

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # start applies the migrations and the seeds listed in supabase/config.toml
      - run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime
      - run: supabase test db
      - run: supabase db lint
      - name: Generated types are current
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u app/src/lib/database.types.ts /tmp/database.types.ts

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4
      - run: bash scripts/test-functions.sh

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-docs.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Playwright version
        id: playwright
        working-directory: app
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: app
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: app
      # The CLI prints API_URL, ANON_KEY and SERVICE_ROLE_KEY; a missing name fails the step.
      - name: Local Supabase environment
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          {
            echo "SUPABASE_URL=${API_URL:?API_URL missing from supabase status}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY:?ANON_KEY missing from supabase status}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY missing from supabase status}"
          } >> "$GITHUB_ENV"
      - run: npm run e2e
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
