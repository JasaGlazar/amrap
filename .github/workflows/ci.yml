name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # start applies the migrations and the seeds listed in supabase/config.toml
      - run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime
      - run: supabase test db
      - name: Generated types are current
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u app/src/lib/database.types.ts /tmp/database.types.ts

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-docs.sh
